<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testudo Settings</title>
  <link href="fonts/fonts.css" rel="stylesheet">
  <style>
    :root {
      /* Cipher Terminal — matches popup.html */
      --bg-void: #07070c;
      --bg-app: #0c0c14;
      --bg-surface: #12121e;
      --bg-surface-hover: #181828;
      --bg-elevated: #1a1a2a;

      --phosphor: #00e599;
      --phosphor-dim: #00b377;
      --phosphor-glow: rgba(0, 229, 153, 0.12);
      --phosphor-faint: rgba(0, 229, 153, 0.06);

      --danger: #ff3b5c;
      --danger-glow: rgba(255, 59, 92, 0.12);
      --success: #00e599;
      --warning: #ffaa2c;
      --warning-glow: rgba(255, 170, 44, 0.12);

      --text-bright: #f0f0f5;
      --text-primary: #c8c8d8;
      --text-secondary: #c8c8d8;
      --text-muted: #6e6e8a;
      --text-dim: #3e3e55;

      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-default: rgba(255, 255, 255, 0.06);
      --border-medium: #1e1e30;
      --border-glow: rgba(0, 229, 153, 0.15);

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 10px;

      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Roboto Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-ui);
      background: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* Noise texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 3px; }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-default);
    }

    .header-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: var(--phosphor-faint);
      border: 1px solid rgba(0, 229, 153, 0.08);
    }

    .header-icon img {
      width: 36px;
      height: 36px;
    }

    .header-text h1 {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-bright);
    }

    .header-text p {
      color: var(--text-dim);
      margin-top: 4px;
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border-default);
      padding-bottom: 16px;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: transparent;
      border: 1px solid var(--border-medium);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .tab .material-symbols-outlined {
      font-size: 16px;
    }

    .tab:hover {
      border-color: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .tab.active {
      background: var(--phosphor-faint);
      border-color: rgba(0, 229, 153, 0.2);
      color: var(--phosphor);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .section {
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid var(--border-subtle);
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
    }

    .section-title .material-symbols-outlined {
      font-size: 20px;
      color: var(--phosphor-dim);
    }

    .form-group { margin-bottom: 20px; }
    .form-group:last-child { margin-bottom: 0; }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .form-description {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 8px;
      line-height: 1.5;
    }

    select, input[type="text"], input[type="url"] {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg-void);
      border: 1px solid var(--border-medium);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: var(--font-mono);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--phosphor-dim);
      box-shadow: 0 0 0 2px var(--phosphor-faint);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-default);
    }

    .toggle-group:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .toggle-description {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      background: var(--border-medium);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .toggle.active { background: var(--phosphor-dim); }

    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: var(--text-bright);
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle.active::after { transform: translateX(20px); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn .material-symbols-outlined { font-size: 16px; }

    .btn-primary {
      background: var(--phosphor-faint);
      color: var(--phosphor);
      border: 1px solid rgba(0, 229, 153, 0.15);
    }

    .btn-primary:hover {
      background: var(--phosphor-glow);
      border-color: rgba(0, 229, 153, 0.3);
    }

    .btn-success {
      background: linear-gradient(180deg, #00c77d 0%, #00a366 100%);
      color: white;
    }

    .btn-success:hover {
      background: linear-gradient(180deg, #00e599 0%, #00c77d 100%);
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border-medium);
    }

    .btn-secondary:hover {
      border-color: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .btn-danger {
      background: rgba(255, 59, 92, 0.06);
      color: var(--danger);
      border: 1px solid rgba(255, 59, 92, 0.15);
    }

    .btn-danger:hover {
      background: rgba(255, 59, 92, 0.12);
      border-color: rgba(255, 59, 92, 0.3);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    /* Whitelist */
    .whitelist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .whitelist-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    .whitelist-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .whitelist-add {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .whitelist-add input { flex: 1; }

    .whitelist-table {
      width: 100%;
      border-collapse: collapse;
    }

    .whitelist-table th {
      text-align: left;
      padding: 10px 14px;
      background: var(--bg-void);
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }

    .whitelist-table th:first-child { border-radius: var(--radius-md) 0 0 0; }
    .whitelist-table th:last-child { border-radius: 0 var(--radius-md) 0 0; }

    .whitelist-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-default);
      font-size: 13px;
    }

    .whitelist-table tr:hover td {
      background: rgba(0, 229, 153, 0.02);
    }

    .whitelist-address {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-primary);
    }

    .whitelist-empty {
      text-align: center;
      padding: 40px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .btn-remove {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid rgba(255, 59, 92, 0.2);
      color: var(--danger);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-remove:hover {
      background: rgba(255, 59, 92, 0.08);
      border-color: rgba(255, 59, 92, 0.4);
    }

    /* History */
    .history-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px;
      border-bottom: 1px solid var(--border-default);
      transition: background 0.2s;
    }

    .history-item:hover {
      background: rgba(0, 229, 153, 0.02);
    }

    .history-item:last-child { border-bottom: none; }

    .history-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .history-icon-wrapper.critical {
      background: var(--danger-glow);
      color: var(--danger);
    }

    .history-icon-wrapper.high {
      background: var(--warning-glow);
      color: var(--warning);
    }

    .history-icon-wrapper.medium {
      background: var(--warning-glow);
      color: var(--warning);
    }

    .history-icon-wrapper.low {
      background: var(--phosphor-faint);
      color: var(--phosphor);
    }

    .history-icon-wrapper .material-symbols-outlined { font-size: 18px; }

    .history-details {
      flex: 1;
      min-width: 0;
    }

    .history-address {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-primary);
    }

    .history-meta {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .history-risk {
      font-family: var(--font-mono);
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .history-risk.critical {
      background: var(--danger-glow);
      color: var(--danger);
    }

    .history-risk.high {
      background: var(--warning-glow);
      color: var(--warning);
    }

    .history-risk.medium {
      background: var(--warning-glow);
      color: var(--warning);
    }

    .history-risk.low {
      background: var(--phosphor-faint);
      color: var(--phosphor);
    }

    /* Storage */
    .storage-bar {
      height: 6px;
      background: var(--bg-void);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .storage-bar-fill {
      height: 100%;
      background: var(--phosphor-dim);
      transition: width 0.3s;
      border-radius: 3px;
    }

    .storage-bar-fill.warning { background: var(--warning); }
    .storage-bar-fill.danger { background: var(--danger); }

    .storage-text {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
      letter-spacing: 0.02em;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      background: var(--phosphor-dim);
      color: white;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
    }

    .toast .material-symbols-outlined { font-size: 18px; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { background: var(--danger); }

    /* Danger zone */
    .danger-zone {
      border-color: rgba(255, 59, 92, 0.12);
    }

    .danger-zone .section-title .material-symbols-outlined {
      color: var(--danger);
    }

    /* Focus states */
    :focus-visible {
      outline: 1px solid var(--phosphor);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="options.js" type="module"></script>
</body>
</html>
