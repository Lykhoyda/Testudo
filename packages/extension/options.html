<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testudo Settings</title>
  <link href="fonts/fonts.css" rel="stylesheet">
  <style>
    :root {
      /* Surface stack — 4 elevation layers */
      --bg: #0a0a0b;
      --surface: #141416;
      --surface-raised: #1c1c1f;
      --surface-hover: #222226;

      /* Borders */
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.14);
      --border-subtle: rgba(255, 255, 255, 0.06);

      /* Brand — desaturated teal */
      --brand: #1a9b8c;
      --brand-hover: #26b5a4;
      --brand-dim: #0f7268;
      --brand-bg: rgba(26, 155, 140, 0.1);
      --brand-border: rgba(26, 155, 140, 0.28);

      /* Semantic (safe = brand) */
      --safe: var(--brand);
      --safe-bg: var(--brand-bg);
      --safe-border: var(--brand-border);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.1);
      --warn-border: rgba(245, 158, 11, 0.25);
      --danger: #dc2626;
      --danger-bg: rgba(220, 38, 38, 0.1);
      --danger-border: rgba(220, 38, 38, 0.3);

      /* Text hierarchy */
      --text-bright: #fafafa;
      --text-primary: #e5e5e7;
      --text-secondary: #a0a0a8;
      --text-muted: #6b6b72;
      --text-dim: #5a5a60;

      /* Fonts */
      --font-ui: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;

      /* Radii */
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 10px;
      --r-xl: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 3px; }

    /* ── Sidebar layout — fills viewport ── */
    .opt-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    .opt-side {
      border-right: 1px solid var(--border-default);
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: var(--bg-void);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .opt-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px 24px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-default);
    }

    .opt-brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .opt-brand-text {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-bright);
    }

    .opt-nav-label {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      padding: 12px 12px 8px;
    }

    .opt-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .opt-tab {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      width: 100%;
    }

    .opt-tab:hover {
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    .opt-tab.active {
      background: var(--phosphor-faint);
      border: 1px solid rgba(0, 229, 153, 0.12);
      color: var(--text-bright);
    }

    .opt-tab .material-symbols-outlined {
      font-size: 18px;
      color: var(--text-muted);
    }

    .opt-tab.active .material-symbols-outlined {
      color: var(--phosphor-dim);
    }

    .opt-main {
      padding: 48px 56px 64px;
      overflow-y: auto;
      max-width: 860px;
    }

    .opt-header {
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-default);
    }

    .opt-title {
      font-family: var(--font-ui);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-bright);
      margin-bottom: 6px;
    }

    .opt-sub {
      font-size: 14px;
      color: var(--text-muted);
    }

    .opt-group {
      margin-bottom: 28px;
    }

    .opt-group-title {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 12px;
      padding-left: 2px;
    }

    .opt-list {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .opt-row {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.15s;
    }

    .opt-row:last-child { border-bottom: none; }
    .opt-row:hover { background: var(--bg-surface-hover); }

    .opt-row-text { flex: 1; min-width: 0; }

    .opt-row-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-bright);
      margin-bottom: 3px;
    }

    .opt-row-desc {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .info-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      gap: 14px;
      margin-bottom: 28px;
    }

    .info-card-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      background: var(--phosphor-faint);
      color: var(--phosphor-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(0, 229, 153, 0.08);
    }

    .info-card-icon .material-symbols-outlined { font-size: 19px; }

    .info-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 3px;
    }

    .info-card-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* ── Legacy container (kept for backward compat) ── */
    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .header-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: var(--r-lg);
      background: var(--brand-bg);
      border: 1px solid var(--brand-border);
      flex-shrink: 0;
    }

    .header-icon img {
      width: 28px;
      height: 28px;
    }

    .header-text h1 {
      font-family: var(--font-ui);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-bright);
    }

    .header-text p {
      color: var(--text-muted);
      margin-top: 2px;
      font-size: 13px;
      font-weight: 400;
    }

    /* ── Tabs (Linear/Raycast style) ── */
    .tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 28px;
      padding: 0;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      margin-bottom: -1px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.005em;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab .material-symbols-outlined {
      font-size: 16px;
    }

    .tab:hover {
      color: var(--text-primary);
    }

    .tab.active {
      color: var(--brand);
      border-bottom-color: var(--brand);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── Section (bordered list group, iOS Settings style) ── */
    .section {
      background: var(--surface);
      border-radius: var(--r-xl);
      border: 1px solid var(--border);
      padding: 20px 22px;
      margin-bottom: 20px;
    }

    .section-title {
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }

    .section-title .material-symbols-outlined {
      font-size: 16px;
      color: var(--text-muted);
    }

    /* ── Form primitives ── */
    .form-group { margin-bottom: 18px; }
    .form-group:last-child { margin-bottom: 0; }

    .form-label {
      display: block;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-primary);
      letter-spacing: -0.005em;
    }

    .form-description {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    select, input[type="text"], input[type="url"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      color: var(--text-primary);
      font-size: 13px;
      font-family: var(--font-ui);
      transition: border-color 0.15s, background 0.15s;
    }

    input[type="text"], input[type="url"] {
      font-family: var(--font-mono);
    }

    select:hover, input:hover {
      border-color: var(--border-hover);
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--brand-border);
      background: var(--surface-hover);
    }

    /* ── Toggle rows (iOS Settings list) ── */
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }

    .toggle-group:first-of-type {
      padding-top: 4px;
    }

    .toggle-group:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .toggle-label {
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: -0.005em;
    }

    .toggle-description {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.4;
    }

    .toggle {
      position: relative;
      width: 38px;
      height: 22px;
      background: var(--surface-hover);
      border: 1px solid var(--border-strong);
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .toggle.active {
      background: var(--brand);
      border-color: var(--brand);
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: var(--text-bright);
      border-radius: 50%;
      transition: transform 0.15s;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .toggle.active::after { transform: translateX(16px); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: var(--r-md);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.005em;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .btn .material-symbols-outlined { font-size: 16px; }

    .btn-primary {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }

    .btn-primary:hover {
      background: var(--brand-hover);
      border-color: var(--brand-hover);
    }

    .btn-success {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }

    .btn-success:hover {
      background: var(--brand-hover);
      border-color: var(--brand-hover);
    }

    .btn-secondary {
      background: var(--surface-raised);
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: var(--danger-border);
    }

    .btn-danger:hover {
      background: rgba(220, 38, 38, 0.16);
      border-color: var(--danger);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    /* ── Whitelist ── */
    .whitelist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .whitelist-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .whitelist-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .whitelist-add {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .whitelist-add input { flex: 1; }

    .whitelist-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface-raised);
      border-radius: var(--r-md);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .whitelist-table th {
      text-align: left;
      padding: 10px 14px;
      background: transparent;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    .whitelist-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-primary);
    }

    .whitelist-table tr:last-child td {
      border-bottom: none;
    }

    .whitelist-table tr:hover td {
      background: var(--surface-hover);
    }

    .whitelist-address {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-primary);
    }

    .whitelist-empty {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 13px;
    }

    .btn-remove {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 500;
      background: transparent;
      border: 1px solid var(--danger-border);
      color: var(--danger);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-remove:hover {
      background: var(--danger-bg);
      border-color: var(--danger);
    }

    /* ── History ── */
    .history-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .history-item:first-of-type {
      padding-top: 4px;
    }

    .history-item:last-child { border-bottom: none; padding-bottom: 0; }

    .history-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--r-md);
      flex-shrink: 0;
    }

    .history-icon-wrapper.critical {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    .history-icon-wrapper.high {
      background: var(--warn-bg);
      color: var(--warn);
      border: 1px solid var(--warn-border);
    }

    .history-icon-wrapper.medium {
      background: var(--warn-bg);
      color: var(--warn);
      border: 1px solid var(--warn-border);
    }

    .history-icon-wrapper.low {
      background: var(--safe-bg);
      color: var(--safe);
      border: 1px solid var(--safe-border);
    }

    .history-icon-wrapper .material-symbols-outlined { font-size: 18px; }

    .history-icon {
      font-size: 16px;
    }

    .history-details {
      flex: 1;
      min-width: 0;
    }

    .history-address {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-primary);
    }

    .history-meta {
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .history-risk {
      font-family: var(--font-ui);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .history-risk.critical {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .history-risk.high {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .history-risk.medium {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .history-risk.low {
      background: var(--safe-bg);
      color: var(--safe);
    }

    /* ── Storage ── */
    .storage-bar {
      height: 6px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .storage-bar-fill {
      height: 100%;
      background: var(--brand);
      transition: width 0.3s;
      border-radius: 2px;
    }

    .storage-bar-fill.warning { background: var(--warn); }
    .storage-bar-fill.danger { background: var(--danger); }

    .storage-text {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--surface-raised);
      color: var(--text-primary);
      border: 1px solid var(--border-hover);
      border-radius: var(--r-md);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.2s, opacity 0.2s;
      pointer-events: none;
    }

    .toast .material-symbols-outlined { font-size: 18px; color: var(--brand); }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .toast.error {
      border-color: var(--danger-border);
    }

    .toast.error .material-symbols-outlined {
      color: var(--danger);
    }

    /* ── Danger Zone ── */
    .danger-zone {
      border-color: var(--danger-border);
    }

    .danger-zone .section-title {
      color: var(--danger);
    }

    .danger-zone .section-title .material-symbols-outlined {
      color: var(--danger);
    }

    /* ── Footer links ── */
    .footer-links {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-family: var(--font-ui);
      font-size: 12px;
      transition: color 0.15s;
    }

    .footer-links a:hover {
      color: var(--text-primary);
    }

    /* ── Focus states ── */
    :focus-visible {
      outline: 1px solid var(--brand);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="options.js" type="module"></script>
</body>
</html>
