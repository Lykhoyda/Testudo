<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testudo</title>
  <link href="fonts/fonts.css" rel="stylesheet">
  <style>
    :root {
      /* Cipher Terminal — deep carbon foundation */
      --bg-void: #07070c;
      --bg-app: #0c0c14;
      --bg-surface: #12121e;
      --bg-surface-hover: #181828;
      --bg-elevated: #1a1a2a;

      /* Phosphor green — the signal */
      --phosphor: #00e599;
      --phosphor-dim: #00b377;
      --phosphor-glow: rgba(0, 229, 153, 0.12);
      --phosphor-faint: rgba(0, 229, 153, 0.06);

      /* Severity spectrum */
      --danger: #ff3b5c;
      --danger-glow: rgba(255, 59, 92, 0.12);
      --warning: #ffaa2c;
      --warning-glow: rgba(255, 170, 44, 0.12);
      --neutral: #4a4a6a;
      --neutral-glow: rgba(74, 74, 106, 0.12);

      /* Typography */
      --text-bright: #f0f0f5;
      --text-primary: #c8c8d8;
      --text-muted: #6e6e8a;
      --text-dim: #3e3e55;

      /* Borders */
      --border-hard: rgba(255, 255, 255, 0.06);
      --border-glow: rgba(0, 229, 153, 0.15);

      /* Fonts */
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Roboto Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      min-height: 500px;
      font-family: var(--font-ui);
      background: var(--bg-app);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 2px; }

    /* ─── Animations ─── */
    @keyframes scan-sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes glow-breathe {
      0%, 100% { box-shadow: 0 0 12px -4px var(--phosphor-glow), inset 0 0 12px -8px var(--phosphor-glow); }
      50% { box-shadow: 0 0 20px -2px rgba(0, 229, 153, 0.18), inset 0 0 20px -6px rgba(0, 229, 153, 0.1); }
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--bg-void);
      border-bottom: 1px solid var(--border-hard);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }

    .header-title {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-bright);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .header-btn:hover {
      border-color: var(--border-hard);
      color: var(--text-bright);
      background: var(--bg-surface);
    }

    /* ─── Main ─── */
    .main {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 18px;
    }

    /* ─── Hero Status — the centerpiece ─── */
    .hero-card {
      position: relative;
      background: var(--bg-surface);
      border: 1px solid var(--border-glow);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
      animation: fade-up 0.4s ease-out, glow-breathe 4s ease-in-out infinite;
    }

    /* Scan line accent */
    .hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--phosphor) 30%, var(--phosphor) 70%, transparent 100%);
      opacity: 0.6;
    }

    .hero-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--phosphor), transparent);
      animation: scan-sweep 3s linear infinite;
      opacity: 0.5;
    }

    .hero-icon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--phosphor-faint);
      border: 1px solid rgba(0, 229, 153, 0.12);
      color: var(--phosphor);
      flex-shrink: 0;
    }

    .hero-icon { font-size: 24px; }

    .hero-content {
      display: flex;
      flex-direction: column;
      gap: 3px;
      position: relative;
      z-index: 1;
    }

    .hero-title {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-bright);
    }

    .hero-subtitle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 400;
      color: var(--phosphor-dim);
    }

    .hero-subtitle::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--phosphor);
      animation: pulse-dot 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    /* ─── Stats Grid ─── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      animation: fade-up 0.4s ease-out 0.1s both;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hard);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.25s, background 0.25s;
      position: relative;
      overflow: hidden;
    }

    .stat-card:hover {
      border-color: rgba(255, 255, 255, 0.1);
      background: var(--bg-surface-hover);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-hard), transparent);
    }

    .stat-header {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .stat-icon { font-size: 16px; }

    .stat-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-bright);
      line-height: 1;
    }

    /* ─── Recent Activity ─── */
    .activity-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fade-up 0.4s ease-out 0.2s both;
    }

    .activity-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .activity-title {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .activity-view-all {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--phosphor-dim);
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--phosphor-faint);
      border: 1px solid rgba(0, 229, 153, 0.08);
      cursor: pointer;
      transition: all 0.2s;
    }

    .activity-view-all:hover {
      background: var(--phosphor-glow);
      color: var(--phosphor);
      border-color: rgba(0, 229, 153, 0.2);
    }

    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .activity-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-surface);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-hard);
      cursor: pointer;
      transition: all 0.2s;
    }

    .activity-item:hover {
      background: var(--bg-surface-hover);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .activity-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .activity-icon-wrapper.critical {
      background: var(--danger-glow);
      color: var(--danger);
    }

    .activity-icon-wrapper.high {
      background: var(--warning-glow);
      color: var(--warning);
    }

    .activity-icon-wrapper.medium {
      background: var(--warning-glow);
      color: var(--warning);
    }

    .activity-icon-wrapper.low {
      background: var(--phosphor-faint);
      color: var(--phosphor);
    }

    .activity-icon-wrapper.unknown {
      background: var(--neutral-glow);
      color: var(--neutral);
    }

    .activity-icon { font-size: 16px; }

    .activity-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      gap: 3px;
    }

    .activity-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .activity-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .activity-badge.critical {
      background: var(--danger-glow);
      color: var(--danger);
    }

    .activity-badge.high {
      background: var(--warning-glow);
      color: var(--warning);
    }

    .activity-badge.medium {
      background: var(--warning-glow);
      color: var(--warning);
    }

    .activity-badge.low {
      background: var(--phosphor-faint);
      color: var(--phosphor);
    }

    .activity-badge.unknown {
      background: var(--neutral-glow);
      color: var(--neutral);
    }

    .activity-time {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
    }

    .activity-address {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 28px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      background: var(--bg-surface);
      border-radius: 8px;
      border: 1px solid var(--border-hard);
    }

    /* ─── Footer ─── */
    .footer {
      padding: 12px 18px;
      border-top: 1px solid var(--border-hard);
      background: var(--bg-void);
      margin-top: auto;
    }

    .footer-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      transition: color 0.2s;
      background: none;
      border: none;
      cursor: pointer;
    }

    .footer-link:hover { color: var(--text-muted); }

    .footer-icon { font-size: 16px; }

    /* ─── Focus states ─── */
    :focus-visible {
      outline: 1px solid var(--phosphor);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
