<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testudo</title>
  <link href="fonts/fonts.css" rel="stylesheet">
  <style>
    :root {
      /* Surface stack — 4 elevation layers */
      --bg: #0a0a0b;
      --surface: #141416;
      --surface-raised: #1c1c1f;
      --surface-hover: #222226;

      /* Borders */
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.14);

      /* Brand — desaturated teal */
      --brand: #1a9b8c;
      --brand-hover: #26b5a4;
      --brand-dim: #0f7268;
      --brand-bg: rgba(26, 155, 140, 0.1);
      --brand-border: rgba(26, 155, 140, 0.28);

      /* Semantic (safe = brand) */
      --safe: var(--brand);
      --safe-bg: var(--brand-bg);
      --safe-border: var(--brand-border);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.1);
      --warn-border: rgba(245, 158, 11, 0.25);
      --danger: #dc2626;
      --danger-bg: rgba(220, 38, 38, 0.1);
      --danger-border: rgba(220, 38, 38, 0.3);

      /* Text hierarchy */
      --text-bright: #fafafa;
      --text-primary: #e5e5e7;
      --text-secondary: #a0a0a8;
      --text-muted: #6b6b72;
      --text-dim: #5a5a60;

      /* Fonts */
      --font-ui: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;

      /* Radii */
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 10px;
      --r-xl: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      min-height: 500px;
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 2px; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
    }

    .header-title {
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-bright);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--r-md);
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .header-btn:hover {
      background: var(--surface);
      color: var(--text-primary);
      border-color: var(--border);
    }

    /* ── Main ── */
    .main {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }

    /* ── Hero status ── */
    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .hero-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: var(--r-md);
      background: var(--safe-bg);
      color: var(--safe);
      flex-shrink: 0;
    }

    .hero-icon { font-size: 22px; }

    .hero-content {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .hero-title {
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.005em;
      color: var(--text-bright);
    }

    .hero-subtitle {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* ── Stats Grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }

    .stat-card:hover {
      border-color: var(--border-hover);
      background: var(--surface-raised);
    }

    .stat-header {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .stat-icon { font-size: 14px; }

    .stat-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .stat-value {
      font-family: var(--font-ui);
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text-bright);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    /* ── Recent Activity ── */
    .activity-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .activity-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .activity-title {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .activity-view-all {
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      color: var(--brand);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .activity-view-all:hover {
      color: var(--brand-hover);
    }

    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .activity-item {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .activity-item:hover {
      background: var(--surface-raised);
      border-color: var(--border-hover);
    }

    .activity-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .activity-item.expanded {
      background: var(--surface-raised);
      border-color: var(--border-hover);
    }

    .activity-main {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: transparent;
      border: 0;
      width: 100%;
      text-align: left;
      color: inherit;
      font: inherit;
      cursor: pointer;
      border-radius: var(--r-md);
    }

    .activity-main:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .activity-item.expanded .activity-main {
      border-radius: var(--r-md) var(--r-md) 0 0;
    }

    .activity-chevron {
      font-size: 18px !important;
      color: var(--text-dim);
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .activity-chevron.open {
      transform: rotate(180deg);
      color: var(--text-muted);
    }

    .activity-details {
      position: relative;
      border-top: 1px solid var(--border);
      padding: 14px 14px 16px;
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.45;
    }

    .activity-details::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 12px;
      right: 12px;
      height: 2px;
      border-radius: 0 0 2px 2px;
      background: var(--border-strong);
      opacity: 0.8;
    }

    .activity-details[data-risk="critical"]::before { background: var(--danger); }
    .activity-details[data-risk="high"]::before,
    .activity-details[data-risk="medium"]::before { background: var(--warn); }
    .activity-details[data-risk="low"]::before { background: var(--safe); }

    .activity-details-grid {
      display: grid;
      grid-template-columns: 68px 1fr;
      row-gap: 8px;
      column-gap: 12px;
      margin: 0;
    }

    .activity-details-grid dt {
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 10px;
      font-weight: 600;
      align-self: start;
      padding-top: 2px;
    }

    .activity-details-grid dd {
      margin: 0;
      color: var(--text);
      word-break: break-all;
      font-size: 13px;
    }

    .activity-details-mono {
      font-family: var(--font-mono);
      font-size: 12px !important;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .activity-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px 3px 8px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.01em;
      border: 1px solid transparent;
    }

    .activity-status.blocked {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }

    .activity-status.allowed {
      color: var(--safe);
      background: var(--safe-bg);
      border-color: var(--safe-border);
    }

    .activity-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 20%, transparent);
      flex-shrink: 0;
    }

    .activity-threats {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 5px;
    }

    .activity-threat-chip {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      line-height: 1.5;
    }

    .activity-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: var(--r-md);
      flex-shrink: 0;
    }

    .activity-icon-wrapper.critical {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    .activity-icon-wrapper.high {
      background: var(--warn-bg);
      color: var(--warn);
      border: 1px solid var(--warn-border);
    }

    .activity-icon-wrapper.medium {
      background: var(--warn-bg);
      color: var(--warn);
      border: 1px solid var(--warn-border);
    }

    .activity-icon-wrapper.low {
      background: var(--safe-bg);
      color: var(--safe);
      border: 1px solid var(--safe-border);
    }

    .activity-icon-wrapper.unknown {
      background: var(--surface-raised);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .activity-icon { font-size: 15px; }

    .activity-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      gap: 3px;
    }

    .activity-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .activity-badge {
      font-family: var(--font-ui);
      font-size: 9px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .activity-badge.critical { background: var(--danger-bg); color: var(--danger); }
    .activity-badge.high { background: var(--warn-bg); color: var(--warn); }
    .activity-badge.medium { background: var(--warn-bg); color: var(--warn); }
    .activity-badge.low { background: var(--safe-bg); color: var(--safe); }
    .activity-badge.unknown { background: var(--surface-raised); color: var(--text-muted); }

    .activity-time {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .activity-address {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 28px;
      color: var(--text-muted);
      font-size: 12px;
      background: var(--surface);
      border-radius: var(--r-xl);
      border: 1px solid var(--border);
    }

    /* ── Footer ── */
    .footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      margin-top: auto;
    }

    .footer-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-family: var(--font-ui);
      font-size: 12px;
      transition: color 0.15s;
      background: none;
      border: none;
      cursor: pointer;
    }

    .footer-link:hover { color: var(--text-primary); }

    .footer-icon { font-size: 15px; }

    /* ── Focus states ── */
    :focus-visible {
      outline: 1px solid var(--brand);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
