services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "bn", "--rpc-url", "http://localhost:8545"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testudo
      POSTGRES_PASSWORD: testudo_test
      POSTGRES_DB: testudo_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testudo -d testudo_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  testudo-api:
    build:
      context: ../testudo-api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://testudo:testudo_test@postgres:5432/testudo_test
      DATABASE_SSL: "false"
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  selenium:
    image: selenium/standalone-chromium:latest
    platform: linux/amd64
    ports:
      - "4444:4444"
      - "5900:5900"
      - "7900:7900"
    environment:
      SE_NODE_MAX_SESSIONS: "1"
      SE_VNC_NO_PASSWORD: "1"
    shm_size: "2gb"
    depends_on:
      anvil:
        condition: service_healthy
      testudo-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 10s
      timeout: 5s
      retries: 10
