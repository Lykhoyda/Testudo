services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "bn", "--rpc-url", "http://localhost:8545"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testudo
      POSTGRES_PASSWORD: testudo_test
      POSTGRES_DB: testudo_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testudo -d testudo_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  testudo-api:
    image: ghcr.io/lykhoyda/testudo-api:latest
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://testudo:testudo_test@postgres:5432/testudo_test
      DATABASE_SSL: "false"
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 15s
